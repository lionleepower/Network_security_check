name: Validate skill and offline tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 skills/proxy-env-doctor/scripts/validate_skill.py
      - run: python -X utf8 -m unittest discover -s skills/proxy-env-doctor/scripts -p "test_*.py"
      - run: node --test skills/proxy-env-doctor/scripts/test_runtime.cjs skills/proxy-env-doctor/scripts/test_mihomo_guard_adapter.cjs skills/proxy-env-doctor/scripts/test_native_collector.cjs
      - run: git diff --check
